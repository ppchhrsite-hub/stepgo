<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8b5cf6" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  
  <!-- Outer Glowing Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#glow-grad)" stroke-width="24" filter="url(#shadow)" />
  
  <!-- Inner footprints / walking path graphic -->
  <g transform="translate(146, 136) scale(0.43)" fill="url(#glow-grad)">
    <!-- Left foot print -->
    <g transform="rotate(-15 150 250)">
      <!-- Heel -->
      <ellipse cx="140" cy="380" rx="35" ry="45" />
      <!-- Arch / Sole -->
      <path d="M 115,340 C 110,250 145,190 145,140 C 145,110 110,100 90,120 C 70,140 75,250 85,340 Z" />
      <!-- Toes -->
      <circle cx="75" cy="70" r="18" />
      <circle cx="108" cy="55" r="16" />
      <circle cx="140" cy="50" r="15" />
      <circle cx="172" cy="58" r="13" />
      <circle cx="200" cy="75" r="11" />
    </g>
    
    <!-- Right foot print -->
    <g transform="rotate(10 350 200) translate(140, -110)">
      <!-- Heel -->
      <ellipse cx="140" cy="380" rx="35" ry="45" />
      <!-- Arch / Sole -->
      <path d="M 165,340 C 170,250 135,190 135,140 C 135,110 170,100 190,120 C 210,140 205,250 195,340 Z" />
      <!-- Toes -->
      <circle cx="205" cy="70" r="18" />
      <circle cx="172" cy="55" r="16" />
      <circle cx="140" cy="50" r="15" />
      <circle cx="108" cy="58" r="13" />
      <circle cx="80" cy="75" r="11" />
    </g>
  </g>
</svg>
